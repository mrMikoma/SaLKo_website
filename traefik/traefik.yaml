global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: false

# Traefik's own log (start, certificates, provider errors), on stderr
log:
  level: INFO
  format: json

# One JSON line per request on stdout. The container is labelled
# logging=promtail, so Alloy ships it to Loki (monitoring/alloy/config.alloy).
accessLog:
  format: json
  # Every status is logged: this is a small club site, and the 2xx lines show
  # that the site is alive. Add a `filters.statusCodes` block here only if the
  # volume ever becomes a problem.
  bufferingSize: 100
  fields:
    defaultMode: keep
    names:
      # Visitors' addresses are personal data and nothing in the dashboards
      # needs them
      ClientAddr: drop
      ClientHost: drop
      ClientPort: drop
      ClientUsername: drop
    headers:
      # Cookie, Authorization and Set-Cookie must never reach the logs. Drop
      # all request and response headers, and keep two harmless ones.
      defaultMode: drop
      names:
        User-Agent: keep
        Content-Type: keep
  # RequestPath is the path without the query string (tokens and codes in
  # URLs); RequestURI-style fields are not logged.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

  # The monitoring agent scrapes Traefik here (monitoring/alloy/config.alloy);
  # not published on the host
  metrics:
    address: ":8080"

metrics:
  prometheus:
    entryPoint: metrics

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: global_outgoing
  file:
    filename: /traefik.yaml
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: admin@savonlinnanlentokerho.fi
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        # disablePropagationCheck: true # uncomment this if you have issues pulling certificates through cloudflare.
        # delayBeforeCheck: 60s # uncomment along with disablePropagationCheck if needed.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

http:
  middlewares:
    internal-only:
      ipAllowList:
        sourceRange:
          - "10.1.0.0/16" # Hetzner Cloud network
          - "10.10.0.0/24" # Home site network
          - "10.20.0.0/24" # Vanttula site network
          - "127.0.0.1/32" # Localhost
          # No Docker networks: every container on the host, the public apps
          # included, would count as internal
