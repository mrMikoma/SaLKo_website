# The monitoring server: Prometheus (metrics), Loki (logs), Grafana,
# Alertmanager (alert emails) and the gateway that agents push to. It keeps no
# ties to the app host: it can run on salko0 next to the apps, as now, or on
# any other host in the private network.
# deploy-monitoring.yaml puts it on vars.MONITORING_SERVER_IP, or on
# vars.SERVER_IP_SALKO0 when that is unset. Each app host runs the agent
# (docker-compose.monitoring-agent.yaml), which collects that host's metrics
# and logs and pushes them here through the gateway. See monitoring/README.md.
#
#   docker compose --env-file .env.monitoring-server -f docker-compose.monitoring.yaml up -d
name: salko-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: ${NAME_PREFIX}-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      # The agents push their samples (remote write) through the gateway
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ${MONITORING_DATA_DIR:-/home/salko/monitoring}/prometheus-data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - logging=promtail
      - traefik.enable=true
      - traefik.docker.network=salko_monitoring
      - traefik.http.routers.prometheus.rule=Host(`prometheus.savonlinnanlentokerho.fi`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=cloudflare
      - traefik.http.routers.prometheus.middlewares=internal-only@file
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  loki:
    image: grafana/loki:3.7.9
    container_name: ${NAME_PREFIX}-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${MONITORING_DATA_DIR:-/home/salko/monitoring}/loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - logging=promtail
      - traefik.enable=true
      - traefik.docker.network=salko_monitoring
      - traefik.http.routers.loki.rule=Host(`loki.savonlinnanlentokerho.fi`)
      - traefik.http.routers.loki.entrypoints=websecure
      - traefik.http.routers.loki.tls.certresolver=cloudflare
      - traefik.http.routers.loki.middlewares=internal-only@file
      - traefik.http.services.loki.loadbalancer.server.port=3100

  grafana:
    image: grafana/grafana:12.4.13-ubuntu
    container_name: ${NAME_PREFIX}-grafana
    volumes:
      - ${MONITORING_DATA_DIR:-/home/salko/monitoring}/grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    # Next to Traefik (salko0), Grafana is grafana.savonlinnanlentokerho.fi.
    # On a host of its own it is also published on that host's private
    # address, http://<MONITORING_BIND_ADDR>:3000 (unpublished by default).
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin@savonlinnanlentokerho.fi
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://grafana.savonlinnanlentokerho.fi}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=
      # The overview opens first: is the site up, is anything wrong
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/salko-overview.json
    labels:
      - logging=promtail
      - traefik.enable=true
      - traefik.docker.network=salko_monitoring
      - traefik.http.routers.grafana.rule=Host(`grafana.savonlinnanlentokerho.fi`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=cloudflare
      - traefik.http.routers.grafana.middlewares=internal-only@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
      - loki
      - alertmanager

  # Sends Prometheus' alerts by email (monitoring/alertmanager/alertmanager.yml).
  # Not published: Grafana shows its alerts and silences (Alerting).
  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: ${NAME_PREFIX}-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # One instance, no cluster
      - "--cluster.listen-address="
      # Its UI is not reachable, so the links in the emails go to Grafana
      - "--web.external-url=${GRAFANA_ROOT_URL:-https://grafana.savonlinnanlentokerho.fi}"
      - "--web.route-prefix=/"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      # Silences and what has been sent; created from the image, owned by its user
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - logging=promtail

  # Loads the public sites as a visitor would, through Cloudflare, when
  # Prometheus asks (monitoring/blackbox/blackbox.yml): is the site up, how
  # fast, when its certificate expires
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: ${NAME_PREFIX}-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - logging=promtail

  # The only way in for the agents: Loki's push and Prometheus' remote write,
  # behind a password (monitoring/gateway/nginx.conf). Loki and Prometheus have
  # no login of their own. An agent on this host pushes over the Docker network
  # (http://monitoring-gateway:8080); one on another host pushes to
  # http://<MONITORING_BIND_ADDR>:3101, the private address this host
  # publishes the gateway on.
  monitoring-gateway:
    image: nginx:1.30.6-alpine
    container_name: ${NAME_PREFIX}-monitoring-gateway
    volumes:
      - ./monitoring/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MONITORING_DATA_DIR:-/home/salko/monitoring}/gateway/htpasswd:/etc/nginx/htpasswd:ro
    networks:
      monitoring:
        aliases:
          - monitoring-gateway
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:3101:8080"
    restart: unless-stopped
    labels:
      - logging=promtail
    depends_on:
      - prometheus
      - loki

networks:
  # Shared with the agent and Traefik when they run on this host. Created by
  # Ansible (docker_install) and by deploy-monitoring.yaml, not by this file,
  # so that the agent's stack and this one can each come and go.
  monitoring:
    external: true
    name: salko_monitoring

volumes:
  alertmanager-data:
