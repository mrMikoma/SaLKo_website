# Dependabot version updates.
#
# Dependabot only reads this file from the default branch (main). A copy on
# dev does nothing until it has been merged to main. The update pull requests
# themselves are opened against dev (target-branch).
#
# For every ecosystem below: minor and patch updates arrive as one grouped
# pull request per week, major updates arrive as individual pull requests.
#
# Because target-branch is set, none of these settings apply to Dependabot
# security updates; those always target the default branch.
#
# The ignore lists below hold major versions that are upgraded by hand, as
# their own planned change, rather than from a Dependabot pull request.

version: 2

updates:
  # Next.js app: nextjs/package.json + nextjs/bun.lock
  - package-ecosystem: "bun"
    directory: "/nextjs"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # The types follow the Node major the app and CI run on (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js and typescript-eslint need the TypeScript JS API, which 7.x
      # (the native port) does not provide yet; CI fails on 7.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # METAR cronjob: cronjobs/update-metar/package.json (no lockfile)
  - package-ecosystem: "npm"
    directory: "/cronjobs/update-metar"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # The types follow the job's Node image major (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Moves together with the app's TypeScript (5.x)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images in the Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/nextjs"
      - "/cronjobs/update-metar"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # A new Node major moves the job, CI and @types/node together
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Images in the docker-compose.*.yaml files
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/cronjobs"
      - "/traefik"
      - "/postgres"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # A new major can't open the prod data directory: it needs a dump and
      # restore (or pg_upgrade), and the 18 image also moved its data path
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Check the dashboards and provisioning against a new major first
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions pinned in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Terraform providers and modules
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # 5.26.0+ plans a spurious update on every existing cloudflare_dns_record
      # (cloudflare/terraform-provider-cloudflare#7387). Remove once fixed.
      - dependency-name: "cloudflare/cloudflare"
        versions: [">= 5.26.0"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
