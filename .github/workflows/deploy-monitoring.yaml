name: Deploy Monitoring Stack

# Two parts (monitoring/README.md):
# - the server (docker-compose.monitoring.yaml: Prometheus, Loki, Grafana,
#   Alertmanager and the gateway) on vars.MONITORING_SERVER_IP, the private
#   address of the monitoring host, or on salko0 (vars.SERVER_IP_SALKO0) when
#   that is unset;
# - the agent (docker-compose.monitoring-agent.yaml: Alloy, the exporters,
#   pgAdmin and Umami) on salko0, pushing to the server's gateway.
on:
  push:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - 'docker-compose.monitoring.yaml'
      - 'docker-compose.monitoring-agent.yaml'
      - '.github/workflows/deploy-monitoring.yaml'
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: 'Send a test alert email to admin@savonlinnanlentokerho.fi after the deploy'
        type: boolean
        default: false

concurrency:
  group: deploy-monitoring
  cancel-in-progress: false

env:
  NAME_PREFIX: "salko"

jobs:
  # The monitoring stack watches production, so it is deployed from main only.
  # Checked before a runner is created.
  check-branch:
    name: Check the branch
    runs-on: ubuntu-24.04
    steps:
      - name: Check the branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy the monitoring stack from the main branch only (this run is on $GITHUB_REF)"
            exit 1
          fi

  create-runner:
    name: Create Hetzner Cloud runner
    needs: check-branch
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.create-hcloud-runner.outputs.label }}
      server_id: ${{ steps.create-hcloud-runner.outputs.server_id }}
    steps:
      - name: Create runner
        id: create-hcloud-runner
        uses: Cyclenerd/hcloud-github-runner@94a0a4aa750d832b48cc0f66d24ed56c3fe69448 # v1.4.1
        with:
          mode: create
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          network: ${{ secrets.HETZNER_NETWORK_ID }}
          ssh_key: ${{ secrets.HETZNER_GHA_RUNNER_SSH_KEY_ID }}
          server_type: cx23
          location: hel1
          image: ubuntu-24.04
          pre_runner_script: |
            set -ex
            echo "Configuring private network routing..."
            sleep 10
            PRIVATE_IFACE=$(ip -o addr show | grep "10.1.1." | awk '{print $2}' | head -n1)
            if [ -z "$PRIVATE_IFACE" ]; then
              echo "No private interface found in 10.1.1.0/24 subnet, skipping network configuration"
              exit 0
            fi
            PRIVATE_IP=$(ip -o -4 addr show $PRIVATE_IFACE | awk '{print $4}' | cut -d/ -f1)
            echo "Found interface $PRIVATE_IFACE with IP $PRIVATE_IP"
            cat > /etc/netplan/60-private-network.yaml <<'NETPLAN_EOF'
            network:
              version: 2
              renderer: networkd
              ethernets:
                PLACEHOLDER_IFACE:
                  dhcp4: false
                  dhcp6: false
                  accept-ra: false
                  addresses:
                    - PLACEHOLDER_IP/32
                  routes:
                    - to: 10.1.0.0/16
                      via: 10.1.0.1
                      on-link: true
                      metric: 100
                  nameservers:
                    addresses:
                      - 1.1.1.1
                      - 1.0.0.1
            NETPLAN_EOF
            sed -i "s/PLACEHOLDER_IFACE/$PRIVATE_IFACE/g" /etc/netplan/60-private-network.yaml
            sed -i "s|PLACEHOLDER_IP|$PRIVATE_IP|g" /etc/netplan/60-private-network.yaml
            netplan apply
            echo "Network configuration applied successfully"
            ip route show

  deploy:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    environment: production
    permissions:
      contents: read
    env:
      # The app host, where the agent runs
      APP_HOST: ${{ vars.SERVER_IP_SALKO0 }}
      # The monitoring server's host: a private address, as the server
      # publishes its gateway and Grafana on it when it is not the app host
      MONITORING_HOST: ${{ vars.MONITORING_SERVER_IP || vars.SERVER_IP_SALKO0 }}
      AGENT_HOST: salko0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$APP_HOST" >> ~/.ssh/known_hosts
          if [ "$MONITORING_HOST" != "$APP_HOST" ]; then
            ssh-keyscan -H "$MONITORING_HOST" >> ~/.ssh/known_hosts
          fi
          if [ "$MONITORING_HOST" = "$APP_HOST" ]; then
            echo "The monitoring server runs on the app host ($APP_HOST)"
          else
            echo "The monitoring server runs on $MONITORING_HOST, the agent on $APP_HOST"
          fi

      - name: Transfer the files
        run: |
          ssh -i ~/.ssh/id_ed25519 "salko@$MONITORING_HOST" 'mkdir -p monitoring'
          scp -i ~/.ssh/id_ed25519 ./docker-compose.monitoring.yaml "salko@$MONITORING_HOST:docker-compose.monitoring.yaml"
          scp -i ~/.ssh/id_ed25519 -r ./monitoring/prometheus ./monitoring/loki ./monitoring/grafana ./monitoring/alertmanager ./monitoring/gateway ./monitoring/blackbox ./monitoring/scripts "salko@$MONITORING_HOST:monitoring/"

          ssh -i ~/.ssh/id_ed25519 "salko@$APP_HOST" 'mkdir -p monitoring'
          scp -i ~/.ssh/id_ed25519 ./docker-compose.monitoring-agent.yaml "salko@$APP_HOST:docker-compose.monitoring-agent.yaml"
          scp -i ~/.ssh/id_ed25519 -r ./monitoring/alloy ./monitoring/scripts "salko@$APP_HOST:monitoring/"

      # Secrets reach the scripts on stdin, never on a command line
      - name: Deploy the monitoring server
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # On its own host the server publishes the gateway and Grafana on
          # the private address; next to the apps it publishes nothing outside
          # the host
          if [ "$MONITORING_HOST" = "$APP_HOST" ]; then bind=127.0.0.1; else bind="$MONITORING_HOST"; fi
          {
            printf 'export NAME_PREFIX=%q\n' "$NAME_PREFIX"
            printf 'export MONITORING_BIND_ADDR=%q\n' "$bind"
            printf 'export GRAFANA_ADMIN_PASSWORD=%q\n' "$GRAFANA_ADMIN_PASSWORD"
            echo 'bash monitoring/scripts/deploy-server.sh </dev/null'
          } | ssh -i ~/.ssh/id_ed25519 "salko@$MONITORING_HOST" bash -s

      - name: Deploy the agent
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
        run: |
          # The agents' password is made on the server (deploy-server.sh)
          push_password=$(ssh -i ~/.ssh/id_ed25519 "salko@$MONITORING_HOST" 'cat monitoring/gateway/push-password')
          echo "::add-mask::$push_password"
          if [ "$MONITORING_HOST" = "$APP_HOST" ]; then
            push_url=http://monitoring-gateway:8080
            elsewhere=false
          else
            push_url="http://$MONITORING_HOST:3101"
            elsewhere=true
          fi
          {
            printf 'export NAME_PREFIX=%q\n' "$NAME_PREFIX"
            printf 'export AGENT_HOST=%q\n' "$AGENT_HOST"
            printf 'export MONITORING_PUSH_URL=%q\n' "$push_url"
            printf 'export MONITORING_PUSH_PASSWORD=%q\n' "$push_password"
            printf 'export SERVER_ELSEWHERE=%q\n' "$elsewhere"
            printf 'export GRAFANA_ADMIN_PASSWORD=%q\n' "$GRAFANA_ADMIN_PASSWORD"
            printf 'export POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export UMAMI_APP_SECRET=%q\n' "$UMAMI_APP_SECRET"
            echo 'bash monitoring/scripts/deploy-agent.sh </dev/null'
          } | ssh -i ~/.ssh/id_ed25519 "salko@$APP_HOST" bash -s

      # End to end: the agent's own metric and its logs have reached the server
      - name: Check that the agent's data arrives
        run: |
          ssh -i ~/.ssh/id_ed25519 "salko@$MONITORING_HOST" AGENT_HOST="$AGENT_HOST" NAME_PREFIX="$NAME_PREFIX" bash -s <<'EOF'
            set -u
            ask() { docker exec "$NAME_PREFIX-monitoring-gateway" wget -qO- "$1" 2>/dev/null || true; }
            metric="http://prometheus:9090/api/v1/query?query=up%7Bjob%3D%22alloy%22%2Chost%3D%22${AGENT_HOST}%22%7D"
            logs="http://loki:3100/loki/api/v1/query?query=sum(count_over_time(%7Bhost%3D%22${AGENT_HOST}%22%7D%5B2m%5D))"
            for _ in $(seq 1 24); do
              if ask "$metric" | grep -q '"1"\]' && ask "$logs" | grep -q '"result":\[{'; then
                echo "✅ Metrics and logs from $AGENT_HOST arrive at the server"
                exit 0
              fi
              sleep 5
            done
            echo "❌ No metrics or logs from $AGENT_HOST after 2 minutes" >&2
            docker logs --tail 20 "$NAME_PREFIX-monitoring-gateway" >&2 || true
            exit 1
          EOF

      # Proves the whole way to the inbox: Alertmanager, Google's SMTP relay
      # (which must accept this host's IP) and the email itself
      - name: Send a test alert email
        if: ${{ inputs.send_test_alert }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "salko@$MONITORING_HOST" "NAME_PREFIX=$NAME_PREFIX bash monitoring/scripts/send-test-alert.sh </dev/null"

      - name: Post Task Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Monitoring Stack Deployment Summary"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Server host:** \`${MONITORING_HOST}\`$([ "$MONITORING_HOST" = "$APP_HOST" ] && echo ' (the app host)')"
            echo "- **Agent host:** \`${APP_HOST}\` (${AGENT_HOST})"
            echo "- **Grafana:** https://grafana.savonlinnanlentokerho.fi$([ "$MONITORING_HOST" != "$APP_HOST" ] && echo " or http://${MONITORING_HOST}:3000")"
            echo "- **Deployment Status:** \`${{ job.status }}\`"
            echo ""
            echo "### Services"
            echo "- Server: Prometheus (with the alert rules), Loki, Grafana, Alertmanager (alert emails to admin@savonlinnanlentokerho.fi), the blackbox exporter (uptime probes), the push gateway"
            echo "- Agent: Grafana Alloy (logs and metrics), Node Exporter, cAdvisor, Postgres Exporters, pgAdmin, Umami"
            echo ""
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  delete-runner:
    name: Delete Hetzner Cloud runner
    needs:
      - create-runner
      - deploy
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.create-runner.outputs.server_id != '' }}
    steps:
      - name: Delete runner
        uses: Cyclenerd/hcloud-github-runner@94a0a4aa750d832b48cc0f66d24ed56c3fe69448 # v1.4.1
        with:
          mode: delete
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}
