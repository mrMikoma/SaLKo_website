name: Deploy dev branch

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Version to deploy"
        required: true
        default: "latest"
        type: string
      branch_name:
        description: "Branch to deploy"
        required: true
        default: "dev"
        type: string

# One deploy at a time; a newer one waits for the running one to finish
concurrency:
  group: deploy-app-dev
  cancel-in-progress: false

env:
  NAME_PREFIX: "salko"
  SITE_PREFIX: "kehitys"
  HOST_URL: "savonlinnanlentokerho.fi"

jobs:
  # The inputs reach shell scripts here and on the server, so only known values
  # pass, and only through env, never into a script's text. Checked before a
  # runner is created.
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-24.04
    outputs:
      image_tag_name: ${{ steps.inputs.outputs.image_tag_name }}
      image_version: ${{ steps.inputs.outputs.image_version }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" || "$BRANCH_NAME" != "dev" ]]; then
            echo "::error::kehitys is deployed from the dev branch only (run from dev, branch_name dev)"
            exit 1
          fi
          if [[ ! "$IMAGE_VERSION" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::image_version must be latest or vN.N.N"
            exit 1
          fi
          repo=$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")
          echo "image_tag_name=ghcr.io/${repo}-nextjs-dev" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

  create-runner:
    name: Create Hetzner Cloud runner
    needs: check-inputs
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.create-hcloud-runner.outputs.label }}
      server_id: ${{ steps.create-hcloud-runner.outputs.server_id }}
    steps:
      - name: Create runner
        id: create-hcloud-runner
        uses: Cyclenerd/hcloud-github-runner@v1.4.1
        with:
          mode: create
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          network: ${{ secrets.HETZNER_NETWORK_ID }}
          ssh_key: ${{ secrets.HETZNER_GHA_RUNNER_SSH_KEY_ID }}
          server_type: cx23
          location: hel1
          image: ubuntu-24.04
          pre_runner_script: |
            set -ex
            echo "Configuring private network routing..."
            sleep 10
            PRIVATE_IFACE=$(ip -o addr show | grep "10.1.1." | awk '{print $2}' | head -n1)
            if [ -z "$PRIVATE_IFACE" ]; then
              echo "No private interface found in 10.1.1.0/24 subnet, skipping network configuration"
              exit 0
            fi
            PRIVATE_IP=$(ip -o -4 addr show $PRIVATE_IFACE | awk '{print $4}' | cut -d/ -f1)
            echo "Found interface $PRIVATE_IFACE with IP $PRIVATE_IP"
            cat > /etc/netplan/60-private-network.yaml <<'NETPLAN_EOF'
            network:
              version: 2
              renderer: networkd
              ethernets:
                PLACEHOLDER_IFACE:
                  dhcp4: false
                  dhcp6: false
                  accept-ra: false
                  addresses:
                    - PLACEHOLDER_IP/32
                  routes:
                    - to: 10.1.0.0/16
                      via: 10.1.0.1
                      on-link: true
                      metric: 100
                  nameservers:
                    addresses:
                      - 1.1.1.1
                      - 1.0.0.1
            NETPLAN_EOF
            sed -i "s/PLACEHOLDER_IFACE/$PRIVATE_IFACE/g" /etc/netplan/60-private-network.yaml
            sed -i "s|PLACEHOLDER_IP|$PRIVATE_IP|g" /etc/netplan/60-private-network.yaml
            netplan apply
            echo "Network configuration applied successfully"
            ip route show

  deploy:
    needs:
      - check-inputs
      - create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    environment: development
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG_NAME: ${{ needs.check-inputs.outputs.image_tag_name }}
      IMAGE_VERSION: ${{ needs.check-inputs.outputs.image_version }}

    steps:
      # The commit this run is for, so the deployed files are the reviewed
      # ones on dev
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            docker-compose.dev.yaml
            postgres/init/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.SERVER_IP_SALKO0 }} >> ~/.ssh/known_hosts

      - name: Transfer configuration files to SERVER
        run: |
          echo "Transferring docker-compose.dev.yaml..."
          if ! scp -i ~/.ssh/id_ed25519 ./docker-compose.dev.yaml salko@${{ vars.SERVER_IP_SALKO0 }}:/home/salko/docker-compose.dev.yaml; then
            echo "Failed to transfer docker-compose.dev.yaml"
            exit 1
          fi

          echo "Creating postgres-dev directory if it doesn't exist..."
          if ! ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "mkdir -p /home/salko/postgres-dev/init"; then
            echo "Failed to create directory"
            exit 1
          fi

          echo "Transferring postgres init scripts..."
          if ! scp -i ~/.ssh/id_ed25519 ./postgres/init/* salko@${{ vars.SERVER_IP_SALKO0 }}:/home/salko/postgres-dev/init/; then
            echo "Failed to transfer init scripts"
            exit 1
          fi

          echo "Adjusting permissions on transferred files..."
          if ! ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "chmod 644 /home/salko/postgres-dev/init/*"; then
            echo "Failed to adjust file permissions"
            exit 1
          fi

          echo "Verifying files were transferred correctly..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "ls -la /home/salko/postgres-dev/init/"

      - name: Deploy APP to SERVER
        env:
          BRANCH_SUFFIX: "dev"
          NODE_ENV: "production"
          CONTAINER_PORT: "3000"
          HOST_PORT: "3010"
          HOSTNAME: "0.0.0.0"
          PGPORT: "5432"
          POSTGRES_USER: "salko_admin"
          POSTGRES_DB: "salko"
          APP_DB_USER: "salko_app"
          NEXTAUTH_URL: "https://${{ env.SITE_PREFIX }}.${{ env.HOST_URL }}"
        run: |
          echo "Deploying to environment..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} << "EOF"
            # Create or clear the .env.dev file
            > .env.dev

            # Append environment variables one by one
            echo "NAME_PREFIX=${{ env.NAME_PREFIX }}" > .env.dev
            echo "SITE_PREFIX=${{ env.SITE_PREFIX }}" >> .env.dev
            echo "BRANCH_SUFFIX=${{ env.BRANCH_SUFFIX }}" >> .env.dev
            echo "NODE_ENV=${{ env.NODE_ENV }}" >> .env.dev
            echo "CONTAINER_PORT=${{ env.CONTAINER_PORT }}" >> .env.dev
            echo "HOST_PORT=${{ env.HOST_PORT }}" >> .env.dev
            echo "HOSTNAME=${{ env.HOSTNAME }}" >> .env.dev
            echo "HOST_URL=${{ env.HOST_URL }}" >> .env.dev
            echo "IMAGE_TAG_NAME=${{ env.IMAGE_TAG_NAME }}" >> .env.dev
            echo "IMAGE_VERSION=${{ env.IMAGE_VERSION }}" >> .env.dev
            echo "PGPORT=${{ env.PGPORT }}" >> .env.dev
            echo "POSTGRES_USER=${{ env.POSTGRES_USER }}" >> .env.dev
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.dev
            echo "POSTGRES_DB=${{ env.POSTGRES_DB }}" >> .env.dev
            echo "APP_DB_USER=${{ env.APP_DB_USER }}" >> .env.dev
            echo "APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}" >> .env.dev
            echo "PGTZ=UTC" >> .env.dev
            echo "NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" >> .env.dev
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.dev
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.dev
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.dev
            # Unfinished features, on in dev only (nextjs/utilities/features.ts)
            echo "FEATURE_FLIGHT_LOG=true" >> .env.dev
            echo "FEATURE_BILLING=true" >> .env.dev
            # Historiaa and Hallit: shown on kehitys for the club members' review
            echo "FEATURE_PAGES_IN_REVIEW=true" >> .env.dev
            # The "Esimerkkilennot" button on /admin/lennot (made-up flights into the sheet)
            echo "FLIGHT_LOG_SAMPLE_DATA=true" >> .env.dev
            # The dev flight log Google Sheet (nextjs/docs/FLIGHT_LOG_SETUP.md), from
            # the development environment's secrets: the spreadsheet's ID and the
            # service account's JSON key file as is. The key is base64-encoded here,
            # so its quotes and line breaks survive the env file; the app decodes it.
            # Unset secrets leave the flight log pages saying the sheet isn't set up.
            echo "FLIGHT_LOG_SPREADSHEET_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env.dev
            echo "GOOGLE_SERVICE_ACCOUNT_KEY=$(printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' | base64 -w0)" >> .env.dev
            # Email (nextjs/docs/MAIL_SETUP.md): kehitys sends every message to
            # MAIL_REDIRECT_TO, never to its recipient; the dev database's seed has
            # real addresses. Without that secret, mail stays off and is only stored.
            echo "MAIL_MODE=redirect" >> .env.dev
            echo "MAIL_REDIRECT_TO=${{ secrets.MAIL_REDIRECT_TO }}" >> .env.dev
            echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> .env.dev
            echo "MAIL_GMAIL_CLIENT_ID=${{ secrets.MAIL_GMAIL_CLIENT_ID }}" >> .env.dev
            echo "MAIL_GMAIL_CLIENT_SECRET=${{ secrets.MAIL_GMAIL_CLIENT_SECRET }}" >> .env.dev
            echo "MAIL_REFRESH_TOKEN=${{ secrets.MAIL_REFRESH_TOKEN }}" >> .env.dev

            # Ensure the environment variables are written before proceeding
            echo ".env.dev file created with environment variables."
            
            # Secure the .env.dev file permissions (readable only by owner)
            chmod 600 .env.dev
            echo "Secured .env.dev file permissions to 600."

            # Pull the latest images
            echo "Pulling the latest Docker images..."
            docker compose -p salko-dev --env-file .env.dev -f docker-compose.dev.yaml pull

            # Stop the current containers and remove volumes (fresh start for dev)
            echo "Stopping containers and removing volumes for fresh dev environment..."
            docker compose -p salko-dev --env-file .env.dev -f docker-compose.dev.yaml down -v
            sleep 5

            # Start the containers using Docker Compose and wait for healthy state
            echo "Starting containers using Docker Compose..."
            for attempt in 1 2 3; do
              if docker compose -p salko-dev --env-file .env.dev -f docker-compose.dev.yaml up -d --wait --wait-timeout 120; then
                echo "Containers started successfully on attempt $attempt."
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "Failed to start containers after 3 attempts."
                exit 1
              else
                echo "Attempt $attempt failed, retrying in 15s..."
                sleep 15
              fi
            done

            # Verify the deployment
            echo "Verifying the deployment..."
            if docker ps | grep -q "salko-nextjs-${{ env.BRANCH_SUFFIX }}"; then
              echo "Deployment successful: salko-nextjs-${{ env.BRANCH_SUFFIX }} is running."
            else
              echo "Deployment failed: salko-nextjs-${{ env.BRANCH_SUFFIX }} is not running."
              docker ps
              exit 1
            fi

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete."
          EOF

      - name: Update monitoring secrets
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Updating monitoring secrets..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} << 'EOF'
            # Update .env.monitoring with dev secrets, adding the line when the
            # monitoring deploy left it out. The exporter logs in as the
            # superuser (POSTGRES_USER), with the password URL-encoded
            password_url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' '${{ env.POSTGRES_PASSWORD }}')
            sed -i '/^DEV_POSTGRES_EXPORTER_DSN=/d' .env.monitoring
            echo "DEV_POSTGRES_EXPORTER_DSN=postgresql://salko_admin:${password_url}@salko-postgres-dev:5432/salko?sslmode=disable" >> .env.monitoring
            chmod 600 .env.monitoring
            echo "✅ Monitoring secrets updated"

            # Recreate the services whose settings changed: a restart would
            # keep their old environment
            echo "Applying to the monitoring stack..."
            docker compose --env-file .env.monitoring -f docker-compose.monitoring.yaml up -d || true
          EOF

      - name: Notify success
        if: ${{ success() }}
        run: |
          echo "✅ Deployment successful!"
          echo "Site is available at: https://${{ env.SITE_PREFIX }}.${{ env.HOST_URL }}"

      - name: Notify failure
        if: ${{ failure() }}
        run: |
          echo "❌ Deployment failed!"

      - name: Post Task Summary
        run: |
          {
            echo "## Deployment Summary"
            echo "- **Environment:** Development"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Image Version:** \`${{ env.IMAGE_VERSION }}\`"
            echo "- **Image Tag:** \`${{ env.IMAGE_TAG_NAME }}\`"
            echo "- **Site URL:** [https://${{ env.SITE_PREFIX }}.${{ env.HOST_URL }}](https://${{ env.SITE_PREFIX }}.${{ env.HOST_URL }})"
            echo "- **Deployment Status:** \`${{ job.status }}\`"
            echo "- **Workflow:** ${{ github.workflow }}"
            echo "- **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY

  delete-runner:
    name: Delete Hetzner Cloud runner
    needs:
      - create-runner
      - deploy
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.create-runner.outputs.server_id != '' }}
    steps:
      - name: Delete runner
        uses: Cyclenerd/hcloud-github-runner@v1.4.1
        with:
          mode: delete
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}