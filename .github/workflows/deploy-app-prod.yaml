name: Deploy production from main branch

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Version to deploy"
        required: true
        default: "latest"
        type: string
      branch_name:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string

env:
  NAME_PREFIX: "salko"
  SITE_PREFIX: "www"
  HOST_URL: "savonlinnanlentokerho.fi"

jobs:
  # The inputs reach shell scripts here and on the server, so only known values
  # pass, and only through env, never into a script's text. Checked before a
  # runner is created.
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-24.04
    outputs:
      image_tag_name: ${{ steps.inputs.outputs.image_tag_name }}
      image_version: ${{ steps.inputs.outputs.image_version }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$BRANCH_NAME" != "main" ]]; then
            echo "::error::Production is deployed from the main branch only (run from main, branch_name main)"
            exit 1
          fi
          if [[ ! "$IMAGE_VERSION" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::image_version must be latest or vN.N.N"
            exit 1
          fi
          repo=$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")
          echo "image_tag_name=ghcr.io/${repo}-nextjs" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

  create-runner:
    name: Create Hetzner Cloud runner
    needs: check-inputs
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.create-hcloud-runner.outputs.label }}
      server_id: ${{ steps.create-hcloud-runner.outputs.server_id }}
    steps:
      - name: Create runner
        id: create-hcloud-runner
        uses: Cyclenerd/hcloud-github-runner@94a0a4aa750d832b48cc0f66d24ed56c3fe69448 # v1.4.1
        with:
          mode: create
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          network: ${{ secrets.HETZNER_NETWORK_ID }}
          ssh_key: ${{ secrets.HETZNER_GHA_RUNNER_SSH_KEY_ID }}
          server_type: cx23
          location: hel1
          image: ubuntu-24.04
          pre_runner_script: |
            set -ex
            echo "Configuring private network routing..."
            sleep 10
            PRIVATE_IFACE=$(ip -o addr show | grep "10.1.1." | awk '{print $2}' | head -n1)
            if [ -z "$PRIVATE_IFACE" ]; then
              echo "No private interface found in 10.1.1.0/24 subnet, skipping network configuration"
              exit 0
            fi
            PRIVATE_IP=$(ip -o -4 addr show $PRIVATE_IFACE | awk '{print $4}' | cut -d/ -f1)
            echo "Found interface $PRIVATE_IFACE with IP $PRIVATE_IP"
            cat > /etc/netplan/60-private-network.yaml <<'NETPLAN_EOF'
            network:
              version: 2
              renderer: networkd
              ethernets:
                PLACEHOLDER_IFACE:
                  dhcp4: false
                  dhcp6: false
                  accept-ra: false
                  addresses:
                    - PLACEHOLDER_IP/32
                  routes:
                    - to: 10.1.0.0/16
                      via: 10.1.0.1
                      on-link: true
                      metric: 100
                  nameservers:
                    addresses:
                      - 1.1.1.1
                      - 1.0.0.1
            NETPLAN_EOF
            sed -i "s/PLACEHOLDER_IFACE/$PRIVATE_IFACE/g" /etc/netplan/60-private-network.yaml
            sed -i "s|PLACEHOLDER_IP|$PRIVATE_IP|g" /etc/netplan/60-private-network.yaml
            netplan apply
            echo "Network configuration applied successfully"
            ip route show

  deploy:
    needs:
      - check-inputs
      - create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    environment: production
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG_NAME: ${{ needs.check-inputs.outputs.image_tag_name }}
      IMAGE_VERSION: ${{ needs.check-inputs.outputs.image_version }}

    steps:
      # The commit this run is for, so the deployed files are the reviewed
      # ones on main
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            docker-compose.prod.yaml
            postgres/init/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.SERVER_IP_SALKO0 }} >> ~/.ssh/known_hosts

      - name: Transfer configuration files to SERVER
        run: |
          echo "Transferring docker-compose.prod.yaml..."
          if ! scp -i ~/.ssh/id_ed25519 ./docker-compose.prod.yaml salko@${{ vars.SERVER_IP_SALKO0 }}:/home/salko/docker-compose.prod.yaml; then
            echo "Failed to transfer docker-compose.prod.yaml"
            exit 1
          fi

          echo "Creating postgres-prod directory if it doesn't exist..."
          if ! ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "mkdir -p /home/salko/postgres-prod/init"; then
            echo "Failed to create directory"
            exit 1
          fi

          echo "Transferring postgres init scripts..."
          if ! scp -i ~/.ssh/id_ed25519 ./postgres/init/* salko@${{ vars.SERVER_IP_SALKO0 }}:/home/salko/postgres-prod/init/; then
            echo "Failed to transfer init scripts"
            exit 1
          fi

          echo "Adjusting permissions on transferred files..."
          if ! ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "chmod 644 /home/salko/postgres-prod/init/*"; then
            echo "Failed to adjust file permissions"
            exit 1
          fi

          echo "Verifying files were transferred correctly..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} "ls -la /home/salko/postgres-prod/init/"

      - name: Deploy APP to SERVER
        env:
          BRANCH_SUFFIX: "prod"
          NODE_ENV: "production"
          CONTAINER_PORT: "3000"
          HOST_PORT: "3000"
          HOSTNAME: "0.0.0.0"
          PGPORT: "5432"
          POSTGRES_USER: "salko_admin"
          POSTGRES_DB: "salko"
          APP_DB_USER: "salko_app"
          UMAMI_DB_USER: "umami_app"
          UMAMI_INTERNAL_URL: "http://salko-umami:3000"
          # The apex, not www: Traefik redirects www there (docker-compose.prod.yaml),
          # so sign-in has to start and end on the apex for its cookies
          NEXTAUTH_URL: "https://${{ env.HOST_URL }}"
        run: |
          echo "Deploying to production environment..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} << "EOF"
            # Umami's own database password, made on the server once and kept
            # there (it used to be the superuser's). Hex, so it needs no quoting.
            if [ ! -s .umami-db-password ]; then
              (umask 077; openssl rand -hex 24 > .umami-db-password)
            fi
            umami_password=$(cat .umami-db-password)

            # Create or clear the .env.prod file
            > .env.prod

            # Append environment variables one by one
            echo "NAME_PREFIX=${{ env.NAME_PREFIX }}" > .env.prod
            echo "SITE_PREFIX=${{ env.SITE_PREFIX }}" >> .env.prod
            echo "BRANCH_SUFFIX=${{ env.BRANCH_SUFFIX }}" >> .env.prod
            echo "NODE_ENV=${{ env.NODE_ENV }}" >> .env.prod
            echo "CONTAINER_PORT=${{ env.CONTAINER_PORT }}" >> .env.prod
            echo "HOST_PORT=${{ env.HOST_PORT }}" >> .env.prod
            echo "HOSTNAME=${{ env.HOSTNAME }}" >> .env.prod
            echo "HOST_URL=${{ env.HOST_URL }}" >> .env.prod
            echo "IMAGE_TAG_NAME=${{ env.IMAGE_TAG_NAME }}" >> .env.prod
            echo "IMAGE_VERSION=${{ env.IMAGE_VERSION }}" >> .env.prod
            echo "PGPORT=${{ env.PGPORT }}" >> .env.prod
            echo "POSTGRES_USER=${{ env.POSTGRES_USER }}" >> .env.prod
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.prod
            echo "POSTGRES_DB=${{ env.POSTGRES_DB }}" >> .env.prod
            echo "APP_DB_USER=${{ env.APP_DB_USER }}" >> .env.prod
            echo "APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}" >> .env.prod
            echo "PGTZ=UTC" >> .env.prod
            echo "NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" >> .env.prod
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.prod
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.prod
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.prod
            echo "UMAMI_DB_USER=${{ env.UMAMI_DB_USER }}" >> .env.prod
            # Used only when a new database is created (06-create-umami-db.sql)
            echo "UMAMI_DB_PASSWORD=$umami_password" >> .env.prod
            echo "UMAMI_INTERNAL_URL=${{ env.UMAMI_INTERNAL_URL }}" >> .env.prod
            echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" >> .env.prod
            # Switched on stage by stage with the production environment's
            # variables (nextjs/docs/GO_LIVE.md); unset means off. The flight
            # log needs FEATURE_FLIGHT_LOG=true (stage B); billing and invoices
            # FEATURE_BILLING=true as well (stage C); email needs MAIL_MODE=send
            # (or redirect, to send everything to MAIL_REDIRECT_TO).
            echo "FEATURE_FLIGHT_LOG=${{ vars.FEATURE_FLIGHT_LOG }}" >> .env.prod
            echo "FEATURE_BILLING=${{ vars.FEATURE_BILLING }}" >> .env.prod
            # Historiaa and Hallit, once the club members have reviewed them
            echo "FEATURE_PAGES_IN_REVIEW=${{ vars.FEATURE_PAGES_IN_REVIEW }}" >> .env.prod
            echo "MAIL_MODE=${{ vars.MAIL_MODE }}" >> .env.prod
            # The club's flight log sheet (nextjs/docs/FLIGHT_LOG_SETUP.md); the key
            # is base64-encoded so its quotes and line breaks survive the env file
            echo "FLIGHT_LOG_SPREADSHEET_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env.prod
            echo "GOOGLE_SERVICE_ACCOUNT_KEY=$(printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' | base64 -w0)" >> .env.prod
            # The club's mail account (nextjs/docs/MAIL_SETUP.md)
            echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> .env.prod
            echo "MAIL_REFRESH_TOKEN=${{ secrets.MAIL_REFRESH_TOKEN }}" >> .env.prod
            echo "MAIL_GMAIL_CLIENT_ID=${{ secrets.MAIL_GMAIL_CLIENT_ID }}" >> .env.prod
            echo "MAIL_GMAIL_CLIENT_SECRET=${{ secrets.MAIL_GMAIL_CLIENT_SECRET }}" >> .env.prod
            echo "MAIL_REDIRECT_TO=${{ secrets.MAIL_REDIRECT_TO }}" >> .env.prod

            # Ensure the environment variables are written before proceeding
            echo ".env.prod file created with environment variables."

            # Secure the .env.prod file permissions (readable only by owner)
            chmod 600 .env.prod
            echo "Secured .env.prod file permissions to 600."

            # Pull the latest images
            echo "Pulling the latest Docker images..."
            docker compose -p salko-prod --env-file .env.prod -f docker-compose.prod.yaml pull

            # Stop the current containers (keep data for production)
            echo "Stopping containers..."
            docker compose -p salko-prod --env-file .env.prod -f docker-compose.prod.yaml down

            # Start the containers using Docker Compose
            echo "Starting containers using Docker Compose..."
            docker compose -p salko-prod --env-file .env.prod -f docker-compose.prod.yaml up -d

            # Wait for services to start
            sleep 15

            # Verify the deployment
            echo "Verifying the deployment..."
            if docker ps | grep -q "salko-nextjs-${{ env.BRANCH_SUFFIX }}"; then
              echo "Deployment successful: salko-nextjs-${{ env.BRANCH_SUFFIX }} is running."
            else
              echo "Deployment failed: salko-nextjs-${{ env.BRANCH_SUFFIX }} is not running."
              docker ps
              exit 1
            fi

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete."
          EOF

      - name: Update monitoring secrets
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
        run: |
          echo "Updating monitoring secrets..."
          ssh -i ~/.ssh/id_ed25519 salko@${{ vars.SERVER_IP_SALKO0 }} << 'EOF'
            # Update .env.monitoring with prod secrets. The exporter logs in as
            # the superuser (POSTGRES_USER), with the password URL-encoded
            password_url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' '${{ env.POSTGRES_PASSWORD }}')
            sed -i '/^PROD_POSTGRES_EXPORTER_DSN=/d' .env.monitoring
            echo "PROD_POSTGRES_EXPORTER_DSN=postgresql://salko_admin:${password_url}@salko-postgres-prod:5432/salko?sslmode=disable" >> .env.monitoring
            chmod 600 .env.monitoring
            # Umami's own password (made by the deploy step above): set it on the
            # existing role, and only then point Umami at it. If that fails,
            # Umami keeps the URL it has.
            umami_password=$(cat .umami-db-password 2>/dev/null || true)
            if [ -n "$umami_password" ] && printf "ALTER ROLE umami_app PASSWORD '%s';\n" "$umami_password" \
                | docker exec -i salko-postgres-prod sh -c 'psql -X -q -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1'; then
              touch .umami-db-password-set
              sed -i '/^DATABASE_URL=/d' .env.monitoring
              echo "DATABASE_URL=postgresql://umami_app:${umami_password}@salko-postgres-prod:5432/umami" >> .env.monitoring
            else
              echo "⚠️ Umami's database password was not changed; it keeps its old URL"
            fi
            sed -i "s|^APP_SECRET=.*|APP_SECRET=${{ env.UMAMI_APP_SECRET }}|" .env.monitoring || true
            echo "✅ Monitoring secrets updated"

            # Recreate the services whose settings changed: a restart would
            # keep their old environment. The exporters and Umami are in the
            # monitoring agent's stack; on a host still on the older single
            # monitoring stack, in that one.
            echo "Applying to the monitoring stack..."
            if [ -f docker-compose.monitoring-agent.yaml ]; then
              docker compose --env-file .env.monitoring -f docker-compose.monitoring-agent.yaml up -d || true
            else
              docker compose --env-file .env.monitoring -f docker-compose.monitoring.yaml up -d || true
            fi
          EOF

      - name: Notify success
        if: ${{ success() }}
        run: |
          echo "✅ Deployment successful!"
          echo "Site is available at: https://${{ env.HOST_URL }}"

      - name: Notify failure
        if: ${{ failure() }}
        run: |
          echo "❌ Deployment failed!"

      - name: Post Task Summary
        run: |
          {
            echo "## Deployment Summary"
            echo "- **Environment:** Production"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Image Version:** \`${{ env.IMAGE_VERSION }}\`"
            echo "- **Image Tag:** \`${{ env.IMAGE_TAG_NAME }}\`"
            echo "- **Site URL:** [https://${{ env.HOST_URL }}](https://${{ env.HOST_URL }})"
            echo "- **Deployment Status:** \`${{ job.status }}\`"
            echo "- **Workflow:** ${{ github.workflow }}"
            echo "- **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY

  delete-runner:
    name: Delete Hetzner Cloud runner
    needs:
      - create-runner
      - deploy
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.create-runner.outputs.server_id != '' }}
    steps:
      - name: Delete runner
        uses: Cyclenerd/hcloud-github-runner@94a0a4aa750d832b48cc0f66d24ed56c3fe69448 # v1.4.1
        with:
          mode: delete
          github_token: ${{ secrets.HETZNER_GHA_RUNNER_PAT }}
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}
