---
- name: Make sure sshd reads the drop-in directory first
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
  notify: Restart SSH

- name: Harden SSH configuration
  ansible.builtin.template:
    src: 00-salko-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-salko-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Ensure root has SSH directory
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'

- name: Ensure users are allowed
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "AllowUsers root salko"
    insertafter: EOF
  notify: Restart SSH

# The drop-in was checked on its own; check everything sshd will read
# together, so a bad combination stops the play before the restart
- name: Check the whole sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  when: not ansible_check_mode

- name: Apply SSH configuration changes
  ansible.builtin.meta: flush_handlers

- name: Read effective sshd settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false
  when: not ansible_check_mode

- name: Check that only key logins are allowed
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in ssh_hardening_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in ssh_hardening_effective.stdout_lines"
      - "'pubkeyauthentication yes' in ssh_hardening_effective.stdout_lines"
      - "'permitrootlogin without-password' in ssh_hardening_effective.stdout_lines"
    fail_msg: sshd still allows password or keyboard-interactive logins, check /etc/ssh/sshd_config.d/
  when: not ansible_check_mode
