services:
  postgres:
    image: postgres:17.11
    container_name: ${NAME_PREFIX}-postgres-${BRANCH_SUFFIX}
    networks:
      - internal
    # Only what Postgres and its init scripts read. The app's secrets (the
    # NextAuth secret, the flight log's service-account key, the mail token)
    # stay out of the database container, where a superuser could read its
    # environment.
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGPORT=${PGPORT}
      - PGTZ=${PGTZ}
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - UMAMI_DB_USER=${UMAMI_DB_USER}
      - UMAMI_DB_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - /home/salko/postgres-prod/init:/docker-entrypoint-initdb.d:ro
      - /home/salko/postgres-prod/postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    labels:
      - logging=promtail
      - environment=prod

  nextjs:
    image: ${IMAGE_TAG_NAME}:${IMAGE_VERSION}
    container_name: ${NAME_PREFIX}-nextjs-${BRANCH_SUFFIX}
    networks:
      - internal
      - outgoing
    # Only what the app reads: .env.prod also holds the database
    # superuser's and other services' passwords, which this container
    # must not get (unset ones become empty)
    environment:
      - PORT=${CONTAINER_PORT}
      - HOSTNAME=${HOSTNAME}
      - DATABASE_CONNECTION_STRING=postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@${NAME_PREFIX}-postgres-${BRANCH_SUFFIX}:${PGPORT}/${POSTGRES_DB}
      - NODE_ENV=${NODE_ENV:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - UMAMI_INTERNAL_URL=${UMAMI_INTERNAL_URL:-}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      - FEATURE_FLIGHT_LOG=${FEATURE_FLIGHT_LOG:-}
      - FEATURE_BILLING=${FEATURE_BILLING:-}
      - FEATURE_PAGES_IN_REVIEW=${FEATURE_PAGES_IN_REVIEW:-}
      - FLIGHT_LOG_SAMPLE_DATA=${FLIGHT_LOG_SAMPLE_DATA:-}
      - FLIGHT_LOG_SPREADSHEET_ID=${FLIGHT_LOG_SPREADSHEET_ID:-}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      - MAIL_MODE=${MAIL_MODE:-}
      - MAIL_REDIRECT_TO=${MAIL_REDIRECT_TO:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_GMAIL_CLIENT_ID=${MAIL_GMAIL_CLIENT_ID:-}
      - MAIL_GMAIL_CLIENT_SECRET=${MAIL_GMAIL_CLIENT_SECRET:-}
      - MAIL_REFRESH_TOKEN=${MAIL_REFRESH_TOKEN:-}
      - PGTZ=${PGTZ:-}
      # Logging (nextjs/docs/LOGGING.md): unset is JSON at level info
      - LOG_LEVEL=${LOG_LEVEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # healthcheck:
    #   test: curl --fail http://localhost:3000/ || exit 1
    #   interval: 60s
    #   timeout: 30s
    #   retries: 3
    #   start_period: 30
    labels:
      - logging=promtail
      - environment=prod
      - traefik.enable=true
      - traefik.http.routers.nextjs-${BRANCH_SUFFIX}.rule=Host(`${HOST_URL}`) || Host(`${SITE_PREFIX}.${HOST_URL}`)
      # One host for search engines and sign-in cookies: www answers with a
      # permanent redirect to the same path on the apex
      - traefik.http.middlewares.nextjs-${BRANCH_SUFFIX}-apex.redirectregex.regex=^https?://${SITE_PREFIX}\.${HOST_URL}/(.*)
      - traefik.http.middlewares.nextjs-${BRANCH_SUFFIX}-apex.redirectregex.replacement=https://${HOST_URL}/$${1}
      - traefik.http.middlewares.nextjs-${BRANCH_SUFFIX}-apex.redirectregex.permanent=true
      - traefik.http.routers.nextjs-${BRANCH_SUFFIX}.middlewares=nextjs-${BRANCH_SUFFIX}-apex
      - traefik.http.routers.nextjs-${BRANCH_SUFFIX}.entrypoints=websecure
      - traefik.http.routers.nextjs-${BRANCH_SUFFIX}.tls.certresolver=cloudflare
      - traefik.http.services.nextjs-${BRANCH_SUFFIX}.loadbalancer.server.port=${CONTAINER_PORT}
      # - traefik.http.services.nextjs-${BRANCH_SUFFIX}.loadbalancer.healthcheck
      # - traefik.http.services.nextjs-${BRANCH_SUFFIX}.rateLimit.burst=100
      # - traefik.http.services.nextjs-${BRANCH_SUFFIX}.rateLimit.average=50

networks:
  outgoing:
    external: true
    name: global_outgoing
  internal:
    external: true
    name: salko_prod_internal
