# The monitoring server's gateway (docker-compose.monitoring.yaml): the one
# door the agents push through. It passes on Loki's push API and Prometheus'
# remote write and nothing else, both behind a password. The htpasswd file is
# written on the server by deploy-monitoring.yaml from a password made there.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  # Every push would be a line: 8 a minute per agent, all the same
  access_log off;
  server_tokens off;

  # Docker's DNS, so that a restarted Loki or Prometheus is found again
  resolver 127.0.0.11 valid=30s ipv6=off;

  client_max_body_size 32m;
  proxy_http_version 1.1;
  proxy_read_timeout 60s;
  proxy_request_buffering off;

  server {
    listen 8080;

    auth_basic "SaLKo monitoring";
    auth_basic_user_file /etc/nginx/htpasswd;

    location = /loki/api/v1/push {
      set $loki http://loki:3100;
      proxy_pass $loki;
    }

    location = /api/v1/write {
      set $prometheus http://prometheus:9090;
      proxy_pass $prometheus;
    }

    # For the deploy's check and Docker, without the password
    location = /health {
      auth_basic off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}
