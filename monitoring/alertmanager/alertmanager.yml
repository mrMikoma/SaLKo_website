# Where Prometheus' alerts (monitoring/prometheus/alerts.yml) go: the alert
# relay Worker (alerts.vanttula.fi, homelab-iac/alert-relay), which turns them
# into email to the club's admin address. See "Alerts" in monitoring/README.md.
#
# The relay formats the email, so there are no templates here. Its token is
# read from a file (deploy-server.sh writes it from the GitHub secret
# ALERT_RELAY_TOKEN), never from this config.
route:
  receiver: relay
  # One email per alert and severity: a site outage doesn't pile up with disk
  # warnings, and the same alert on several targets comes as one
  group_by: [alertname, severity]
  group_wait: 1m
  group_interval: 5m
  # Reminders while it still fires: warnings twice a day
  repeat_interval: 12h
  routes:
    # The always-firing Watchdog (alerts.yml) is a heartbeat, not an alert: the
    # relay mails when it stops coming (check salko-monitoring: 5 min period
    # + 10 min grace), which is how a dead salko0 or Docker gets noticed.
    # Re-sent every 4 minutes.
    - matchers: [alertname="Watchdog"]
      receiver: relay-watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 4m
    # Critical every 4 hours
    - matchers: [severity="critical"]
      repeat_interval: 4h

# An alert that follows from another one is not sent while the cause fires
inhibit_rules:
  # The site is down: its health check, slowness and errors follow from that
  - source_matchers: [alertname="WebsiteDown"]
    target_matchers: [alertname=~"WebsiteHealthCheckFailing|WebsiteSlow|WebsiteServerErrors"]
  # Nothing comes from the agent: its host's metrics look missing or down
  - source_matchers: [alertname="MonitoringAgentSilent"]
    target_matchers: [alertname=~"ContainerNotRunning|ContainerRestarting|PostgresDown|PostgresDevDown|Host.+|ScrapeTargetDown|OriginCertificateExpiringSoon"]
  # The disk is full: the warning at 85 % adds nothing
  - source_matchers: [alertname="HostDiskFull"]
    target_matchers: [alertname="HostDiskAlmostFull"]
    equal: [host]

receivers:
  - name: relay
    webhook_configs:
      - url: https://alerts.vanttula.fi/v1/alertmanager?group=salko
        send_resolved: true
        # The relay shows 10; the rest is counted
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert-relay-token
  - name: relay-watchdog
    webhook_configs:
      - url: https://alerts.vanttula.fi/v1/ping/salko-monitoring
        send_resolved: false
        max_alerts: 1
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert-relay-token
