# Blackbox exporter (docker-compose.monitoring.yaml): Prometheus asks it to
# load the public sites as a visitor would, through Cloudflare
# (monitoring/prometheus/prometheus.yml, jobs blackbox and blackbox-health).
modules:
  # The page answers 200
  http_page:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      headers:
        User-Agent: "SaLKo-monitoring (blackbox-exporter)"

  # The app and its database answer: nextjs/app/api/health/route.ts
  http_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"ok"'
      follow_redirects: false
      preferred_ip_protocol: ip4
      headers:
        User-Agent: "SaLKo-monitoring (blackbox-exporter)"
